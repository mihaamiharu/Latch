<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Latch</title><link rel="stylesheet" href="popup.css"></head>
<body><header><img src="icons/latch-48.png" width="40" height="40" alt=""><div><h1>Latch</h1><p>Your browser, connected to your agents.</p></div><span id="badge">Checking</span></header>
<main><section class="connection"><h2 id="connection" role="status">Checking local bridge…</h2><p id="profile">Finding this profile</p><div class="actions"><button id="refresh" type="button">Refresh</button><button id="open-library" type="button" hidden>Open Library</button><button id="retry" type="button" hidden>Retry connection</button></div></section>
<p id="notice" role="status" aria-live="polite"></p><section aria-labelledby="sessions-heading"><div class="section-title"><h2 id="sessions-heading">Agent sessions</h2><span id="count">0</span></div><p id="empty">Loading sessions…</p><div id="sessions"></div></section>
<details id="storage-section" hidden><summary>Library &amp; storage</summary><div class="storage-body"><p id="storage-meta" class="meta"></p><label for="artifacts-dir">Artifacts folder</label><input id="artifacts-dir" type="text" placeholder="Absolute folder path" spellcheck="false"><div class="actions"><button id="choose-folder" type="button">Choose folder…</button><button id="save-artifacts" type="button">Save path</button><button id="reset-artifacts" type="button">Reset default</button></div></div></details>
<details><summary>Connection details</summary><pre id="status"></pre></details><footer>Stopping automation keeps your website tabs open.</footer></main><script type="module" src="popup.js"></script></body></html>
