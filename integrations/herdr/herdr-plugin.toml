id = "local.latch-view"
name = "Latch live view"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Watch an existing native Latch session in a view-only terminal pane"
platforms = ["macos"]

[[actions]]
id = "open"
title = "Open Latch live view"
command = ["bash", "open.sh"]

[[panes]]
id = "live"
title = "Latch browser"
placement = "split"
command = ["bash", "pane.sh"]
